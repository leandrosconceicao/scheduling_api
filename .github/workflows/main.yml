name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

env:
  APP_ENGINE_SERVICE: scheduling-api

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm test

  deploy:
    # Só faz deploy após merge na main, nunca a partir de PR.
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency: deploy-prod

    steps:
      - uses: actions/checkout@v4

      # Gera o app.yaml a partir do secret, forçando o serviço próprio
      # para não tocar no serviço "default" (outra API).
      - name: Create app.yaml
        env:
          APP_YAML_FILE: ${{ secrets.SCHEDULING_APP_YAML }}
        run: |
          {
            echo "service: ${APP_ENGINE_SERVICE}"
            printf '%s\n' "$APP_YAML_FILE" | grep -v '^service:'
          } > app.yaml

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Deploy to App Engine
        run: |
          gcloud app deploy app.yaml --quiet --no-promote \
            --version="sha-${GITHUB_SHA::8}"
